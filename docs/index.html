<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <title>じょすうし ふらっしゅ とれーにんぐ</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <section id="home" class="screen active" aria-labelledby="app-title">
    <header class="home-heading">
      <div class="logo" aria-hidden="true">じょ</div>
      <div>
        <h1 id="app-title">じょすうし ふらっしゅ とれーにんぐ</h1>
        <p class="lead">えを みて、じょすうしを つけて こたえましょう。</p>
      </div>
    </header>

    <main class="setup-card">
      <h2 class="section-title"><span class="step">いち</span>れんしゅうの しかた</h2>
      <div class="mode-grid" id="mode-grid" role="group" aria-label="れんしゅうの しかたを えらぶ">
        <button class="mode-choice selected" data-mode="flash" type="button" aria-pressed="true"><span class="mode-name">ふらっしゅ</span><span class="mode-note">えを みて、すぐに こたえる</span></button>
        <button class="mode-choice" data-mode="roleplay" type="button" aria-pressed="false"><span class="mode-name">やりとり</span><span class="mode-note">しつもんを きいて、こたえる</span></button>
        <button class="mode-choice" data-mode="confirmation" type="button" aria-pressed="false"><span class="mode-name">かくにん</span><span class="mode-note">あと・もう・まだを つかう</span></button>
        <button class="mode-choice" data-mode="chart" type="button" aria-pressed="false"><span class="mode-name">いちらんひょう</span><span class="mode-note">いちから じゅうの よみかた</span></button>
        <button class="mode-choice remaining-choice" data-mode="remaining" type="button" aria-pressed="false"><span class="mode-name">あと　どのぐらい？</span><span class="mode-note">この しつもんだけを れんしゅうする</span></button>
      </div>

      <div id="practice-setup">
      <h2 class="section-title"><span class="step">に</span>じょすうしを えらぶ</h2>
      <div class="counter-tools">
        <button class="quick-button" id="select-all" type="button">ぜんぶ えらぶ</button>
        <button class="quick-button" id="clear-all" type="button">ぜんぶ はずす</button>
      </div>
      <div class="counter-grid" id="counter-grid" role="group" aria-label="じょすうしを えらぶ">
        <button class="counter-choice selected" data-counter="tsu" type="button" aria-pressed="true"><span class="counter-name">〜つ</span></button>
        <button class="counter-choice selected" data-counter="nin" type="button" aria-pressed="true"><span class="counter-name">〜にん</span></button>
        <button class="counter-choice selected" data-counter="hon" type="button" aria-pressed="true"><span class="counter-name">〜ほん</span></button>
        <button class="counter-choice selected" data-counter="mai" type="button" aria-pressed="true"><span class="counter-name">〜まい</span></button>
        <button class="counter-choice selected" data-counter="hiki" type="button" aria-pressed="true"><span class="counter-name">〜ひき</span></button>
        <button class="counter-choice selected" data-counter="wa" type="button" aria-pressed="true"><span class="counter-name">〜わ</span></button>
        <button class="counter-choice selected" data-counter="dai" type="button" aria-pressed="true"><span class="counter-name">〜だい</span></button>
        <button class="counter-choice selected" data-counter="satsu" type="button" aria-pressed="true"><span class="counter-name">〜さつ</span></button>
        <button class="counter-choice selected" data-counter="ko" type="button" aria-pressed="true"><span class="counter-name">〜こ</span></button>
        <button class="counter-choice selected" data-counter="fun" type="button" aria-pressed="true"><span class="counter-name">〜ふん</span></button>
      </div>
      </div>

      <div class="bottom-setup" id="bottom-setup">
        <div id="range-setup">
          <h2 class="section-title"><span class="step">さん</span>かずの はんい</h2>
          <div class="range-row" id="range-row" role="group" aria-label="かずの はんいを えらぶ">
            <button class="range-choice" data-max="5" type="button">いち から ご</button>
            <button class="range-choice selected" data-max="10" type="button">いち から じゅう</button>
          </div>
        </div>
        <section class="speech-setup" aria-labelledby="speech-title">
          <h2 class="speech-title" id="speech-title">おんせい</h2>
          <div class="speech-row" role="group" aria-label="おんせいの はやさ">
            <span class="speech-row-label">はやさ</span>
            <button class="speech-choice" data-speech-rate="0.72" type="button" aria-pressed="false">ゆっくり</button>
            <button class="speech-choice selected" data-speech-rate="1" type="button" aria-pressed="true">ふつう</button>
            <button class="autoplay-button" id="autoplay-button" type="button" aria-pressed="false">じどう: なし</button>
          </div>
          <div class="speech-row">
            <label class="speech-row-label" for="speech-volume">おんりょう</label>
            <input id="speech-volume" type="range" min="0" max="10" step="1" value="10">
            <output class="volume-value" id="volume-value" for="speech-volume">10</output>
          </div>
          <p class="speech-status" id="speech-status" aria-live="polite"></p>
        </section>
        <div>
          <p class="selection-status" id="selection-status" aria-live="polite"></p>
          <button class="start-button" id="start" type="button">はじめる</button>
        </div>
      </div>
    </main>

    <p class="home-tip">もんだいの がめんでは、すぺーすきーで こたえ、みぎの きーで つぎへ すすみます。</p>
  </section>

  <section id="quiz" class="screen" aria-label="もんだい がめん">
    <header class="quiz-header">
      <button class="small-button" id="home-button" type="button">⌂ ほーむ</button>
      <div class="quiz-title" id="quiz-title">みっくす</div>
      <div class="header-actions">
        <button class="small-button" id="display-size-button" type="button" aria-pressed="false" title="ひょうじを ちいさくする"><span id="display-size-icon" aria-hidden="true">↘</span> <span class="display-size-label" id="display-size-label">ちいさく</span></button>
        <button class="small-button" id="fullscreen-button" type="button">ぜんがめん</button>
      </div>
    </header>

    <main class="quiz-main">
      <section class="question-panel" aria-label="もんだい">
        <div class="question-top">
          <span class="mode-tag" id="mode-tag">みっくす</span>
          <span class="item-name" id="item-name"></span>
        </div>
        <div class="role-question" id="role-question">
          <span class="role-label">しつもん</span>
          <span class="question-sentence" id="question-sentence"></span>
          <button class="speech-action" id="speak-question" type="button">🔊 しつもんを きく</button>
        </div>
        <div class="objects" id="objects" aria-label="かずえる もの"></div>
      </section>

      <section class="answer-panel hidden-answer" id="answer-panel" aria-live="polite">
        <div class="answer-label">こたえ</div>
        <div class="answer-reading" id="answer-reading"></div>
        <div class="answer-sentence" id="answer-sentence"></div>
        <button class="speech-action answer-speech-button" id="speak-answer" type="button" disabled>🔊 こたえを きく</button>
      </section>
    </main>

    <footer class="quiz-controls">
      <button class="control-button back-button" id="previous" type="button">← まえ</button>
      <button class="control-button answer-button" id="answer" type="button">こたえを みる</button>
      <button class="control-button next-button" id="next" type="button">つぎの もんだい →</button>
    </footer>
  </section>

  <section id="chart" class="screen" aria-label="いちらんひょう がめん">
    <header class="quiz-header">
      <button class="small-button home-button" type="button">⌂ ほーむ</button>
      <div class="quiz-title">じょすうしの いちらんひょう</div>
      <button class="small-button fullscreen-button" type="button">ぜんがめん</button>
    </header>
    <nav class="chart-tabs" id="chart-tabs" aria-label="じょすうしの しゅるい"></nav>
    <main class="chart-main">
      <div class="chart-info">
        <span class="chart-counter" id="chart-counter"></span>
      </div>
      <table class="reading-table" aria-label="いちから じゅうまでの よみかた">
        <tbody id="reading-body"></tbody>
      </table>
    </main>
    <footer class="chart-controls">
      <button class="control-button back-button" id="chart-previous" type="button">← まえの じょすうし</button>
      <button class="control-button next-button" id="chart-next" type="button">つぎの じょすうし →</button>
    </footer>
  </section>

  <script src="./js/data.js"></script>
  <script src="./js/randomizer.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
